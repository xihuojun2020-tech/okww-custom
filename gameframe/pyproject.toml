[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gameframe-runtime"
version = "1.97.69"
description = "Game-independent visual automation runtime with installable game packages"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.2", "opencv-python>=4.12", "psutil>=7"]

[project.optional-dependencies]
gui = ["PySide6>=6.9"]
windows = ["windows-capture==2.0.1", "pywin32>=311"]

[project.scripts]
gameframe = "gameframe.__main__:main"

[tool.setuptools]
packages = ["gameframe", "gameframe.devices"]
package-dir = {gameframe = "."}
